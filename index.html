<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新しいアプリ（雛形）</title>
<meta name="description" content="バニラHTML/CSS/JSの最小スターター。localStorage保存の実演つき。">
<style>
  /* ── デザインは家族アプリと統一の暖色系。シンプル志向・大きめタップ領域 ── */
  :root{
    --bg:#f4efe6; --card:#fffdf8; --ink:#2a2620; --sub:#6b6357;
    --accent:#1b4332; --line:#e5ddcd;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:28px 20px 48px}
  h1{font-size:1.4rem; margin:0 0 4px}
  .lead{color:var(--sub); margin:0 0 22px}
  .card{background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:18px}
  label{display:block; font-weight:700; margin:0 0 8px}
  /* 入力・ボタンは高さ48px以上＝指で押しやすい */
  input[type=text]{
    width:100%; font-size:1.05rem; padding:12px 14px; min-height:48px;
    border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
  }
  input:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
  .btn{
    margin-top:12px; width:100%; min-height:48px; font-size:1.05rem; font-weight:700;
    color:#fff; background:var(--accent); border:0; border-radius:12px; cursor:pointer;
  }
  .btn:active{opacity:.9}
  .hint{color:var(--sub); font-size:.9rem; margin-top:14px}
  code{background:#efe8da; padding:1px 6px; border-radius:6px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>新しいアプリ（雛形）</h1>
    <p class="lead">この1ファイルをコピーして中身を書き換えれば、新しいアプリが作れます。</p>

    <div class="card">
      <label for="name">お名前（例）</label>
      <input id="name" type="text" placeholder="ここに入力すると自動で保存されます">
      <button class="btn" id="clear" type="button">保存を消す</button>
      <p class="hint">
        入力内容はこの端末の中（<code>localStorage</code>）だけに保存されます。
        サーバには送られません。個人データはこの方式で扱うのが本プロジェクトの方針です。
      </p>
    </div>
  </div>

  <script>
    // ── localStorage 保存の最小サンプル ──
    // キーはアプリごとに一意にする（衝突防止）。新アプリでは名前を変える。
    var KEY = 'template-vanilla-webapp:name';
    var input = document.getElementById('name');
    var clear = document.getElementById('clear');

    // 起動時：保存済みの値を復元
    input.value = localStorage.getItem(KEY) || '';

    // 入力するたびに保存（入力中も消えない）
    input.addEventListener('input', function(){
      localStorage.setItem(KEY, input.value);
    });

    // 保存を消す
    clear.addEventListener('click', function(){
      localStorage.removeItem(KEY);
      input.value = '';
      input.focus();
    });
  </script>
</body>
</html>
